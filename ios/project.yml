name: FreeMyTVRemote
options:
  bundleIdPrefix: io.freemytv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pick your own team in Xcode (Signing & Capabilities); a free Apple ID works for your own phone.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  FreeMyTVRemote:
    type: application
    platform: iOS
    sources:
      - FreeMyTVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.freemytv.remote
        PRODUCT_NAME: TV Remote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TV Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "TV Remote finds your TV or projector on your Wi-Fi and sends it button presses."
    info:
      path: FreeMyTVRemote/Info.plist
      properties:
        # The service RemoteLink announces on the TV (RemoteLink.SERVICE_TYPE).
        NSBonjourServices:
          - _freemytv._tcp
        NSBluetoothAlwaysUsageDescription: "Free My TV uses Bluetooth to connect to and control a nearby Windows PC."
